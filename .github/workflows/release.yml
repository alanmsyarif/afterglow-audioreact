name: Release Noctune Free

# This repository publishes Free only. Pro is maintained in its private repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release and upload the zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the manifest version
        id: metadata
        run: |
          v="$(python -c "import tomllib; print(tomllib.load(open('afterglow/blender_manifest.toml', 'rb'))['version'])")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and validate the Free extension
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          pip install bpy==5.2.2
          EXT="$(python -c "import os, bpy; print(os.path.join(bpy.utils.system_resource('SCRIPTS'), 'addons_core', 'bl_pkg', 'cli', 'blender_ext.py'))" | tail -n 1)"
          python tools/build_editions.py --edition free --output-dir build/public
          python -I "$EXT" validate "build/public/noctune-free-$VERSION.zip"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "build/public/noctune-free-$VERSION.zip" --title "Noctune Free $GITHUB_REF_NAME" --generate-notes
